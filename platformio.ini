[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit MPU6050
    adafruit/Adafruit Unified Sensor
     madhephaestus/ESP32Servo @ ^3.0.5

; Mengaktifkan fungsi USB serial CDC bawaan chip S3
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Mematikan kontrol DTR/RTS yang sering membuat chip freeze saat monitor dibuka
monitor_rts = 0
monitor_dtr = 0
